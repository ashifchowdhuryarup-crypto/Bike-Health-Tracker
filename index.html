    <title>Bike Tracker</title>
    <meta name="description" content="Mobile-first fuel mileage and service reminder tracker for motorcycle owners in Bangladesh with Bangla & English support." />
    <meta property="og:title" content="Bike Tracker" />
    <meta property="og:description" content="Mobile-first fuel mileage and service reminder tracker for motorcycle owners in Bangladesh with Bangla & English support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0D110E" id="meta-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bike Tracker" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        var docEl = document.documentElement;
        try {
          var raw = localStorage.getItem('bike_tracker_settings');
          var parsed = raw ? JSON.parse(raw) : null;
          var isDark = parsed && typeof parsed.darkMode === 'boolean'
            ? parsed.darkMode
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            docEl.classList.add('dark');
          }
          var meta = document.getElementById('meta-theme-color');
          if (meta) {
            meta.setAttribute('content', isDark ? '#0D110E' : '#F6F7F4');
          }
          var isStandalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            window.navigator.standalone === true;
          if (isStandalone) {
            docEl.classList.add('pwa-standalone');
          }
          window.__PWA_STANDALONE__ = isStandalone;
        } catch (e) {}
      })();
    </script>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f6f7f4;
        color: #141912;
        font-family: system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1), transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
        contain: layout style paint;
      }
      html.dark #app-splash {
        background-color: #0d110e;
        color: #f4f6f0;
      }
      #app-splash.splash-exit {
        opacity: 0;
        transform: scale(1.035);
        pointer-events: none;
      }
      #app-splash .splash-stage {
        position: relative;
        width: 84px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-splash .splash-aura {
        position: absolute;
        width: 148px;
        height: 148px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(154, 230, 46, 0.28) 0%, rgba(154, 230, 46, 0.08) 46%, rgba(154, 230, 46, 0) 74%);
        transform: translate3d(0, -34px, 0) scale(0.75);
        opacity: 0;
        pointer-events: none;
        animation: splashAura 0.72s cubic-bezier(0.22, 1, 0.36, 1) 0.14s forwards;
      }
      #app-splash .splash-icon-wrap {
        position: relative;
        width: 84px;
        height: 84px;
        border-radius: 22px;
        background: radial-gradient(circle at 50% 42%, #b4f64b 0%, #7fd017 100%);
        box-shadow: 0 14px 36px rgba(154, 230, 46, 0.24), 0 4px 12px rgba(0, 0, 0, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        will-change: transform, opacity;
        animation: splashIconEnter 0.56s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* Seamless handoff in installed Android PWA: catches the centered OS icon at opacity:1 and smoothly glides it into the compact 84px icon */
      html.pwa-standalone #app-splash .splash-icon-wrap {
        animation: splashIconMorph 0.58s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #app-splash .splash-icon-wrap::after {
        content: '';
        position: absolute;
        inset: -20%;
        background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, 0.42) 48%, transparent 64%);
        transform: translate3d(-120%, 0, 0);
        animation: splashSheen 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.28s 1 both;
        pointer-events: none;
      }
      #app-splash .splash-glyph {
        width: 50px;
        height: 50px;
        display: block;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
      #app-splash .splash-meta {
        position: absolute;
        top: 66px;
        left: 50%;
        width: 240px;
        transform: translate3d(-50%, 0, 0);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      #app-splash .splash-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 28px;
        height: 28px;
        opacity: 0;
        transform: translate3d(0, 12px, 0);
        animation: splashTextRise 0.46s cubic-bezier(0.22, 1, 0.36, 1) 0.22s forwards;
      }
      #app-splash .splash-sub {
        margin-top: 4px;
        font-size: 12px;
        font-weight: 600;
        line-height: 18px;
        height: 18px;
        opacity: 0;
        color: rgba(20, 25, 18, 0.58);
        letter-spacing: 0.015em;
        transform: translate3d(0, 10px, 0);
        animation: splashTextRise 0.46s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
      }
      html.dark #app-splash .splash-sub {
        color: rgba(244, 246, 240, 0.58);
      }
      #app-splash .splash-bar {
        margin-top: 20px;
        width: 88px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(154, 230, 46, 0.18);
        overflow: hidden;
        opacity: 0;
        animation: splashBarFade 0.36s ease-out 0.34s forwards;
      }
      #app-splash .splash-bar-fill {
        width: 44%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #82d219, #b4f64b);
        animation: splashSlide 0.95s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splashIconEnter {
        0% {
          opacity: 0;
          transform: translate3d(0, -18px, 0) scale(0.84);
        }
        68% {
          opacity: 1;
          transform: translate3d(0, -36px, 0) scale(1.03);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, -34px, 0) scale(1);
        }
      }
      @keyframes splashIconMorph {
        0% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1.92);
          border-radius: 26px;
        }
        100% {
          opacity: 1;
          transform: translate3d(0, -34px, 0) scale(1);
          border-radius: 22px;
        }
      }
      @keyframes splashAura {
        0% {
          opacity: 0;
          transform: translate3d(0, -34px, 0) scale(0.72);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, -34px, 0) scale(1);
        }
      }
      @keyframes splashSheen {
        0% { transform: translate3d(-120%, 0, 0); }
        100% { transform: translate3d(135%, 0, 0); }
      }
      @keyframes splashTextRise {
        0% {
          opacity: 0;
          transform: translate3d(0, 12px, 0);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }
      @keyframes splashBarFade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes splashSlide {
        0% { transform: translate3d(-115%, 0, 0); }
        100% { transform: translate3d(245%, 0, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-icon-wrap,
        html.pwa-standalone #app-splash .splash-icon-wrap,
        #app-splash .splash-aura,
        #app-splash .splash-title,
        #app-splash .splash-sub,
        #app-splash .splash-bar,
        #app-splash .splash-icon-wrap::after {
          animation: none !important;
          opacity: 1 !important;
        }
        #app-splash .splash-icon-wrap {
          transform: translate3d(0, -34px, 0) scale(1) !important;
        }
        #app-splash .splash-title,
        #app-splash .splash-sub {
          transform: none !important;
        }
      }
    </style>
  </head>
